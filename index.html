<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>尤克里里弹唱练习</title>

  <!-- 下面这几行让网页变成"可安装的 app"(PWA) -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    body {
      margin: 0;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      background: #0f172a; color: #cbd5e1; line-height: 1.6;
    }
    .screen { max-width: 480px; margin: 0 auto; padding: 24px 16px 300px; }
    h1 { font-size: 20px; text-align: center; color: #fff; margin: 0 0 14px; }
    .song-title { font-size: 17px; text-align: center; color: #fbbf24; font-weight: bold; margin: 0 0 16px; }
    .song-pick { text-align: center; margin-bottom: 14px; }
    .song-pick label { color: #94a3b8; font-size: 14px; margin-right: 6px; }
    .song-pick select {
      font-family: inherit; font-size: 15px; padding: 6px 10px;
      background: #1e293b; color: #fbbf24; border: 1px solid #334155; border-radius: 6px; cursor: pointer;
    }
    .section { font-size: 15px; text-align: center; color: #94a3b8; margin: 36px 0 16px; }

    .chords-bar { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
    .chord-card { background: #1e293b; border-radius: 8px; padding: 8px 6px 4px; text-align: center; }
    .chord-card .name { color: #fbbf24; font-weight: bold; font-size: 16px; margin-bottom: 2px; }

    .sticky-top { position: sticky; top: 0; z-index: 10; background: #0f172a; padding: 6px 0 12px; margin-bottom: 8px; }
    .controls { display: flex; align-items: center; gap: 14px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
    .controls button {
      background: #fbbf24; color: #0f172a; border: none; border-radius: 8px;
      padding: 10px 22px; font-size: 16px; font-weight: bold; cursor: pointer; font-family: inherit;
    }
    .controls .tempo { display: flex; align-items: center; gap: 8px; color: #cbd5e1; font-size: 14px; }
    .controls input[type=range] { width: 130px; }

    .panel { background: #1e293b; border-radius: 12px; padding: 12px; text-align: center; }
    .panel .now { font-size: 13px; color: #94a3b8; }
    .panel .big-chord { font-size: 38px; font-weight: bold; color: #fbbf24; line-height: 1.1; }
    .panel .big-diagram { margin: 4px 0; }
    .strums { display: flex; gap: 16px; justify-content: center; font-size: 22px; margin: 8px 0; }
    .strums span { color: #334155; }
    .strums span.active { color: #fbbf24; }
    .panel .meta { font-size: 13px; color: #94a3b8; }
    .panel .next { color: #cbd5e1; }

    .line { margin-bottom: 16px; padding: 6px 8px; border-radius: 6px; }
    .line.current { background: #16202f; }
    .chords-row { margin-bottom: 2px; }
    .chord-chip { display: inline-block; color: #fbbf24; font-weight: bold; margin-right: 18px; padding: 0 4px; border-radius: 4px; }
    .chord-chip.current { background: #fbbf24; color: #0f172a; }
    .lyric { white-space: pre-wrap; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="screen">
    <h1>🎸 尤克里里弹唱练习</h1>

    <div class="song-pick">
      <label for="song-select">选歌</label>
      <select id="song-select"></select>
    </div>
    <h2 class="song-title" id="song-title"></h2>

    <div id="chords-bar" class="chords-bar"></div>

    <div class="sticky-top">
      <div class="controls">
        <button id="play-btn">▶ 开始</button>
        <div class="tempo">
          速度
          <input id="tempo" type="range" min="40" max="140" value="72">
          <span id="bpm">72</span> BPM
        </div>
      </div>
      <div class="panel">
        <div class="now">现在弹</div>
        <div class="big-chord" id="now-chord">—</div>
        <div class="big-diagram" id="now-diagram"></div>
        <div class="strums" id="strums"></div>
        <div class="meta">
          第 <span id="beat">1</span> / 4 拍 ·
          <span class="next">下一个:<span id="next-chord">—</span></span>
        </div>
      </div>
    </div>

    <div id="song"></div>
  </div>

  <script>
    // ===== 1) 和弦指法数据 =====
    // frets = 四根弦(G C E A,从左到右)分别按第几品;0 = 空弦
    const CHORDS = {
      C:  { frets: [0, 0, 0, 3] },
      G:  { frets: [0, 2, 3, 2] },
      Am: { frets: [2, 0, 0, 0] },
      F:  { frets: [2, 0, 1, 0] },
    };

    // 画一个和弦的指法小图。scale 控制显示大小。
    function drawChord(frets, scale = 1) {
      const W = 56, H = 80;
      const nStrings = 4, nFrets = 4;
      const left = 10, right = W - 10, top = 16, bottom = H - 8;
      const dx = (right - left) / (nStrings - 1);
      const dy = (bottom - top) / nFrets;
      let s = `<svg width="${W * scale}" height="${H * scale}" viewBox="0 0 ${W} ${H}">`;
      for (let i = 0; i < nStrings; i++) {
        if (frets[i] === 0) {
          const x = left + i * dx;
          s += `<circle cx="${x}" cy="8" r="3" fill="none" stroke="#94a3b8" stroke-width="1"/>`;
        }
      }
      s += `<line x1="${left}" y1="${top}" x2="${right}" y2="${top}" stroke="#e5e7eb" stroke-width="3"/>`;
      for (let f = 1; f <= nFrets; f++) {
        const y = top + f * dy;
        s += `<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="#475569" stroke-width="1"/>`;
      }
      for (let i = 0; i < nStrings; i++) {
        const x = left + i * dx;
        s += `<line x1="${x}" y1="${top}" x2="${x}" y2="${bottom}" stroke="#475569" stroke-width="1"/>`;
      }
      for (let i = 0; i < nStrings; i++) {
        if (frets[i] > 0) {
          const x = left + i * dx;
          const y = top + (frets[i] - 0.5) * dy;
          s += `<circle cx="${x}" cy="${y}" r="5" fill="#fbbf24"/>`;
        }
      }
      s += `</svg>`;
      return s;
    }

    // ===== 2) 多首歌的数据(选歌用)=====
    const SONGS = [
      {
        title: "🌈 Somewhere Over the Rainbow",
        tempo: 72, beatsPerChord: 4,
        sections: [
          { lines: [
            { chords: ["C", "G", "Am", "F"], lyric: "Somewhere over the rainbow, way up high" },
            { chords: ["C", "G", "Am", "F"], lyric: "And the dreams that you dream of, once in a lullaby" },
            { chords: ["C", "G", "Am", "F"], lyric: "Somewhere over the rainbow, bluebirds fly" },
            { chords: ["C", "G", "Am", "F"], lyric: "And the dreams that you dare to, oh why oh why can't I" },
          ] },
          { name: '🎵 接着那段 "What a wonderful world"', lines: [
            { chords: ["C", "G", "Am", "F"], lyric: "Well I see trees of green, red roses too" },
            { chords: ["C", "G", "Am", "F"], lyric: "I watch them bloom for me and you" },
            { chords: ["Am", "F", "C", "G"], lyric: "And I think to myself, what a wonderful world" },
          ] },
        ],
      },
      {
        title: "🎹 Let It Be",
        tempo: 70, beatsPerChord: 4,
        sections: [
          { lines: [
            { chords: ["C", "G", "Am", "F"], lyric: "When I find myself in times of trouble" },
            { chords: ["C", "G", "F", "C"], lyric: "Mother Mary comes to me" },
            { chords: ["C", "G", "Am", "F"], lyric: "Speaking words of wisdom, let it be" },
            { chords: ["C", "G", "F", "C"], lyric: "And in my hour of darkness, she is standing right in front of me" },
          ] },
          { name: "🎶 副歌", lines: [
            { chords: ["Am", "G", "F", "C"], lyric: "Let it be, let it be, let it be, let it be" },
            { chords: ["Am", "G", "F", "C"], lyric: "Whisper words of wisdom, let it be" },
          ] },
        ],
      },
      {
        title: "☀️ You Are My Sunshine",
        tempo: 88, beatsPerChord: 4,
        sections: [
          { lines: [
            { chords: ["C", "G"], lyric: "You are my sunshine, my only sunshine" },
            { chords: ["C", "G"], lyric: "You make me happy when skies are gray" },
            { chords: ["C", "G"], lyric: "You'll never know dear, how much I love you" },
            { chords: ["C", "G", "C"], lyric: "Please don't take my sunshine away" },
          ] },
        ],
      },
    ];

    // ===== 3) 当前歌曲 + DOM 引用 =====
    const bar = document.getElementById("chords-bar");
    const songEl = document.getElementById("song");
    const songTitleEl = document.getElementById("song-title");
    const songSelect = document.getElementById("song-select");
    const playBtn = document.getElementById("play-btn");
    const tempoInput = document.getElementById("tempo");
    const bpmLabel = document.getElementById("bpm");
    const nowChord = document.getElementById("now-chord");
    const nowDiagram = document.getElementById("now-diagram");
    const strumsEl = document.getElementById("strums");
    const beatLabel = document.getElementById("beat");
    const nextChord = document.getElementById("next-chord");

    let song = SONGS[0];
    let flat = [];          // 当前歌所有和弦,按顺序
    let lineOfChord = [];   // 每个和弦属于第几行
    let chordChipEls = [];  // 每个和弦的小标签
    let lineEls = [];       // 每一行的元素
    let idx = 0, beat = 0, playing = false, timer = null, lastLine = 0;
    let bpm = song.tempo;
    let audioCtx = null;

    // ===== 4) 渲染一首歌:标题 + 和弦栏 + 歌词,并重建练习用的数组 =====
    function buildSong() {
      songTitleEl.textContent = song.title;
      songEl.innerHTML = "";
      bar.innerHTML = "";
      flat = []; lineOfChord = []; chordChipEls = []; lineEls = [];
      let lineIdx = 0;
      song.sections.forEach((sec) => {
        if (sec.name) {
          const h = document.createElement("h2");
          h.className = "section";
          h.textContent = sec.name;
          songEl.appendChild(h);
        }
        sec.lines.forEach((line) => {
          const lineEl = document.createElement("div");
          lineEl.className = "line";
          const row = document.createElement("div");
          row.className = "chords-row";
          line.chords.forEach((c) => {
            const chip = document.createElement("span");
            chip.className = "chord-chip";
            chip.textContent = c;
            row.appendChild(chip);
            chordChipEls.push(chip);
            flat.push(c);
            lineOfChord.push(lineIdx);
          });
          const ly = document.createElement("div");
          ly.className = "lyric";
          ly.textContent = line.lyric;
          lineEl.appendChild(row);
          lineEl.appendChild(ly);
          songEl.appendChild(lineEl);
          lineEls.push(lineEl);
          lineIdx++;
        });
      });
      // 顶部和弦参考栏:这首歌用到哪些和弦(去重,按出现顺序)
      [...new Set(flat)].forEach((name) => {
        const card = document.createElement("div");
        card.className = "chord-card";
        card.innerHTML = `<div class="name">${name}</div>` + drawChord(CHORDS[name].frets);
        bar.appendChild(card);
      });
    }

    // ===== 5) 音频:现场合成"嗒"声(断网也能响)=====
    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }
    function click(accent) {
      if (!audioCtx) return;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.frequency.value = accent ? 1500 : 900;
      o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.002);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      o.start(t); o.stop(t + 0.06);
    }

    // ===== 6) 练习引擎 =====
    function renderState() {
      const chord = flat[idx];
      nowChord.textContent = chord;
      nowDiagram.innerHTML = CHORDS[chord] ? drawChord(CHORDS[chord].frets, 1.5) : "";
      strumsEl.innerHTML = "";
      for (let i = 0; i < song.beatsPerChord; i++) {
        const s = document.createElement("span");
        s.textContent = "↓";
        if (i === beat) s.className = "active";
        strumsEl.appendChild(s);
      }
      beatLabel.textContent = beat + 1;
      nextChord.textContent = flat[(idx + 1) % flat.length];
      chordChipEls.forEach((el, i) => el.classList.toggle("current", i === idx));
      const li = lineOfChord[idx];
      lineEls.forEach((el, i) => el.classList.toggle("current", i === li));
      if (li !== lastLine) {
        lastLine = li;
        if (lineEls[li]) lineEls[li].scrollIntoView({ block: "center", behavior: "smooth" });
      }
    }
    function tick() {
      click(beat === 0);
      renderState();
      beat++;
      if (beat >= song.beatsPerChord) { beat = 0; idx = (idx + 1) % flat.length; }
    }
    function start() {
      ensureAudio();
      playing = true;
      playBtn.textContent = "⏸ 暂停";
      renderState();
      timer = setInterval(tick, 60000 / bpm);
    }
    function pause() {
      playing = false;
      playBtn.textContent = "▶ 开始";
      clearInterval(timer);
    }

    // ===== 7) 选歌:换歌时停掉、重置、重新渲染 =====
    function loadSong(s) {
      if (playing) pause();
      song = s;
      idx = 0; beat = 0; lastLine = 0;
      bpm = s.tempo;
      tempoInput.value = bpm;
      bpmLabel.textContent = bpm;
      buildSong();
      renderState();
      window.scrollTo({ top: 0 });
    }

    SONGS.forEach((s, i) => {
      const o = document.createElement("option");
      o.value = i;
      o.textContent = s.title;
      songSelect.appendChild(o);
    });
    songSelect.addEventListener("change", () => loadSong(SONGS[parseInt(songSelect.value, 10)]));

    playBtn.addEventListener("click", () => (playing ? pause() : start()));
    tempoInput.addEventListener("input", () => {
      bpm = parseInt(tempoInput.value, 10);
      bpmLabel.textContent = bpm;
      if (playing) { clearInterval(timer); timer = setInterval(tick, 60000 / bpm); }
    });

    // ===== 8) 初始化 =====
    buildSong();
    renderState();
  </script>

  <script>
    // 注册 service worker:让 app 能离线、能"添加到主屏幕"
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => console.log('SW 注册失败:', err));
      });
    }
  </script>
</body>
</html>
