org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# --- 下载优化(治 Gradle 走代理卡死)---
# 超时拉长到 5 分钟,避免频繁超时重试(看着像卡死)
org.gradle.internal.http.connectionTimeout=300000
org.gradle.internal.http.socketTimeout=300000
# 显式告诉 Gradle 走 VPN 代理(确保连接方式正确)
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=17891
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=17891
# 国内/局域网不走代理
systemProp.http.nonProxyHosts=localhost|127.*|[::1]|192.168.*|10.*|172.16.*|172.17.*|172.18.*|172.19.*|172.20.*|172.21.*|172.22.*|172.23.*|172.24.*|172.25.*|172.26.*|172.27.*|172.28.*|172.29.*|172.30.*|172.31.*
systemProp.https.nonProxyHosts=localhost|127.*|[::1]|192.168.*|10.*|172.16.*|172.17.*|172.18.*|172.19.*|172.20.*|172.21.*|172.22.*|172.23.*|172.24.*|172.25.*|172.26.*|172.27.*|172.28.*|172.29.*|172.30.*|172.31.*
# 降低并发(代理对多并发支持差)
org.gradle.parallel=false
